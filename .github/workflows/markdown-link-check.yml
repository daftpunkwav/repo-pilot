name: Markdown Link Check

on:
  push:
    branches: [main]
  pull_request:

# 链接失败(4xx/5xx)直接让 job 失败,起到 CI 拦截作用。
# 范围限定到根目录 / docs / apps/web 的 markdown;
# node_modules / .venv / dist 等噪声目录由 .github/mlc_config.json 排除。
# 注:gaurav-nelson action 无 check-files 参数,有效参数是 folder-path。

jobs:
  markdown-link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          folder-path: '.'
          config-file: '.github/mlc_config.json'
          use-quiet-mode: 'yes'
          max-depth: -1
