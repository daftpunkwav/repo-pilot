name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# backend 测试分层:实际测试在仓库根 tests/(含 pytest.ini + conftest.py),
# pytest.ini 的 pythonpath 指向 services/api 与 services/agent。
# 必须从 tests/ 目录运行,否则找不到 pytest.ini 与 conftest。

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装 uv
        run: pip install uv
      - name: 同步依赖(锁定版本)
        # 根目录是 uv workspace;api 是 member,从根 sync 能解析 workspace 依赖
        run: uv sync --frozen
      - name: 跑单元测试
        # 从 tests/ 目录运行,让 pytest 读到 pytest.ini + conftest.py
        working-directory: tests
        run: uv run --project ../../services/api pytest unit -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          # 项目使用 npm workspaces,lock 文件在仓库根,不在 apps/web/
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: 安装依赖
        run: cd apps/web && npm ci
      - name: ESLint
        run: cd apps/web && npm run lint
      - name: Vitest 单元测试
        # apps/web/package.json 中脚本名为 test(根 package.json 才有 test:web)
        run: cd apps/web && npm run test
      - name: 类型检查
        run: cd apps/web && npm run typecheck
      - name: 生产构建
        run: cd apps/web && npm run build
