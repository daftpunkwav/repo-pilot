name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 注意:此 CI 当前为骨架版本,backend job 的 pytest 路径与 services/api 测试分层
# 仍待后续 infra PR 细化(参见 REMEDIATION_PLAN_20260806.md §4.4.3);不在本 PR 范围内。

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装 uv
        run: pip install uv
      - name: 同步依赖(锁定版本)
        run: cd services/api && uv sync --frozen
      - name: 跑单元测试
        run: cd services/api && uv run pytest tests/unit -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          # 项目使用 npm workspaces,lock 文件在仓库根,不在 apps/web/
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: 安装依赖
        run: cd apps/web && npm ci
      - name: ESLint
        run: cd apps/web && npm run lint
      - name: Vitest 单元测试
        # apps/web/package.json 中脚本名为 test(根 package.json 才有 test:web)
        run: cd apps/web && npm run test
      - name: 类型检查
        run: cd apps/web && npm run typecheck
      - name: 生产构建
        run: cd apps/web && npm run build
