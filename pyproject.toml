[project]
name = "repopilot"
version = "2.0.0"
description = "AI-driven open source project learning platform (monorepo root)"
requires-python = ">=3.11"

[tool.uv.workspace]
members = ["services/api", "services/agent", "services/graph_engine", "services/mcp", "packages/py-shared"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]  # 未排序导入

[tool.ruff.lint.per-file-ignores]
# ensure_service_paths() / sys.path hack 必须置于模块导入之前，属有意为之
"services/api/api_backend/main.py" = ["E402"]
"services/agent/agent_runtime/main.py" = ["E402"]
"services/api/api_backend/migrations/alembic/env.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
mypy_path = ["services/api", "services/agent", "services/graph_engine/graph_engine_runtime"]
explicit_package_bases = true
namespace_packages = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

# 兼容 shim（api_backend/agents|memory|tools|llm/*.py）通过 globals().update() 从
# agent_core 动态 re-export 符号，静态分析无法追踪属预期；运行时已验证可用。
# 此处对消费 shim 的模块豁免 attr-defined（仅 shim 注入的符号报此错）。
[[tool.mypy.overrides]]
module = [
    "api_backend.services.agent_service",
    "api_backend.services.sse_stream",
    "api_backend.api.settings",
    "api_backend.api.user",
]
disable_error_code = ["attr-defined"]
