[project]
name = "repopilot"
version = "2.0.0"
description = "AI-driven open source project learning platform (monorepo root)"
requires-python = ">=3.11"

[tool.uv.workspace]
members = ["services/api", "services/agent", "services/graph_engine", "services/mcp", "packages/py-shared"]

[tool.uv.sources]
repopilot-py-shared = { workspace = true }

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]  # 未排序导入

[tool.ruff.lint.per-file-ignores]
# ensure_service_paths() / sys.path hack 必须置于模块导入之前，属有意为之
"services/api/api_backend/main.py" = ["E402"]
"services/agent/agent_runtime/main.py" = ["E402"]
"services/api/api_backend/migrations/alembic/env.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
mypy_path = ["services/api", "services/agent", "services/graph_engine/graph_engine_runtime", "services/graph_engine/graph_engine_fallback", "packages/py-shared"]
explicit_package_bases = true
namespace_packages = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
